{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="card login">
  <h1>Đăng nhập</h1>
  <form id="f">
    <label>Mã sinh viên<input name="student_id" required autofocus></label>
    <label>Mật khẩu<input name="password" type="password" required></label>
    <button type="submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}
{% block script %}
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await api("/api/v1/auth/login", { method: "POST", body: { student_id: fd.get("student_id"), password: fd.get("password") } });
    location.href = "/";
  } catch (err) { toast(err.message, true); }
};
</script>
{% endblock %}
