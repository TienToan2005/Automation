; Firmware cho MẠCH THẬT: board ESP32-S3 N16R8 có sẵn camera OV5640 + RC522 + OLED + relay/khóa.
; Hướng dẫn nạp: docs/HUONG_DAN_NAP_FIRMWARE.md
;
;   pio run -e esp32s3cam     -t upload    (cắm cáp vào cổng ghi "UART"/"COM": máy hiện CH340/CH343/CP210x)  <- mặc định
;   pio run -e esp32s3cam_usb -t upload    (cắm cáp vào cổng USB GỐC của chip: máy hiện USB 303A:xxxx)
; Chọn đúng môi trường theo cổng đang cắm: log chỉ ra ở cổng tương ứng (UART hoặc USB gốc).
;
; Chữ in trên module kim loại quyết định cấu hình bộ nhớ:
;   ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM octal): đúng như dưới đây
;   N8R8  : đổi board_upload.flash_size = 8MB  và partitions = default_8MB.csv
;   N16R2 / N8R2 (PSRAM 2 MB, quad): đổi memory_type = qio_qspi (và flash_size cho đúng)
; Chọn sai memory_type thì board khởi động lặp đi lặp lại (boot loop).

[platformio]
default_envs = esp32s3cam

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
monitor_echo = yes       ; hiện chữ bạn gõ (mặc định Monitor không hiện gì nên tưởng không gõ được)
monitor_eol = LF
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13
    bblanchon/ArduinoJson@^7.2.1
    miguelbalboa/MFRC522@^1.4.11

; Log đi qua cổng UART (cổng ghi "UART"/"COM", có chip CH340/CH343/CP2102). Nạp tự động, khỏi bấm BOOT. Đây là môi trường mặc định.
[env:esp32s3cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM

; Log đi qua cổng USB GỐC của chip (cổng ghi "USB"), kể cả lúc nạp.
[env:esp32s3cam_usb]
extends = env:esp32s3cam
; Windows + cổng USB gốc: reset bằng chân RTS thường làm board kẹt ở "waiting for download" sau khi nạp.
; Reset bằng watchdog thì board chạy chương trình ngay, khỏi bấm RST.
board_upload.after_reset = watchdog_reset
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
